[versions]

dataforge = "0.12.0"
kotmark = "0.1.0"

[libraries]

dataforge-workspace = { module = "space.kscience:dataforge-workspace", version.ref = "dataforge" }
dataforge-io = { module = "space.kscience:dataforge-io", version.ref = "dataforge" }
dataforge-io-yaml = { module = "space.kscience:dataforge-io-yaml", version.ref = "dataforge" }

jsch = "com.github.mwiede:jsch:2.28.8"

markdown = "org.jetbrains:markdown:0.7.18"

kotmark = { module = "io.heapy.kotmark:kotmark", version.ref = "kotmark" }
kotmark-kotlinx = { module = "io.heapy.kotmark:kotmark-renderer-kotlinx-html", version.ref = "kotmark" }
kotmark-math = { module = "io.heapy.kotmark:kotmark-ext-math", version.ref = "kotmark" }
kotmark-tables = { module = "io.heapy.kotmark:kotmark-ext-gfm-tables", version.ref = "kotmark" }

freemarker = "org.freemarker:freemarker:2.3.35"

mcp-server = "io.modelcontextprotocol:kotlin-sdk-server:0.15.0"